name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Docker build
        run: docker build -t task-manager-api ./backend
