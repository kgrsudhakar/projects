services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: ["./init-db.sql:/docker-entrypoint-initdb.d/init.sql", "pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U postgres"], interval: 5s, retries: 10 }
  policy-service:
    build: ./policy-service
    environment: { DB_URL: "jdbc:postgresql://postgres:5432/policydb" }
    depends_on: { postgres: { condition: service_healthy } }
  claim-service:
    build: ./claim-service
    environment: { DB_URL: "jdbc:postgresql://postgres:5432/claimdb", POLICY_SERVICE_URL: "http://policy-service:8081" }
    depends_on: [policy-service]
  api-gateway:
    build: ./api-gateway
    environment: { POLICY_URL: "http://policy-service:8081", CLAIM_URL: "http://claim-service:8082" }
    ports: ["8080:8080"]
    depends_on: [policy-service, claim-service]
volumes: { pgdata: {} }
