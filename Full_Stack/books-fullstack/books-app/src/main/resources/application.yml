server:
  port: 8080

spring:
  application:
    name: books-app
  datasource:
    url: jdbc:h2:file:./data/booksdb      # file-based H2: data survives restarts
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  h2:
    console:
      enabled: true                       # http://localhost:8080/h2-console

app:
  jwt-secret: ${JWT_SECRET:change-this-secret-to-something-long-and-random-32+chars}
  jwt-expiration-minutes: 15            # short-lived access token
  refresh-expiration-days: 7            # refresh token lifetime
  upload-dir: ./uploads                 # where cover images are stored
  cors-origins: http://localhost:5173,http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.books: INFO
