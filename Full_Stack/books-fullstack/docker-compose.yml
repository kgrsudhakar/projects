# Whole stack: PostgreSQL + Spring Boot API + React (nginx).  Run: docker compose up --build
# Then open http://localhost:3000  (API also reachable directly on :8080)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: booksdb
      POSTGRES_USER: books
      POSTGRES_PASSWORD: books
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d booksdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./books-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/booksdb
      DB_USER: books
      DB_PASSWORD: books
      JWT_SECRET: please-change-this-to-a-long-random-secret-value
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./books-frontend
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
